services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - xiaotuxian-net
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - DB_NAME=xiaotuxian
      - JWT_SECRET=${JWT_SECRET:-xiaotuxian-jwt-secret-key-2026}
      - PORT=3000
      - MIMO_API_KEY=${MIMO_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - ALIPAY_APP_ID=${ALIPAY_APP_ID}
      - ALIPAY_PRIVATE_KEY=${ALIPAY_PRIVATE_KEY}
      - ALIPAY_PUBLIC_KEY=${ALIPAY_PUBLIC_KEY}
      - ALIPAY_GATEWAY=${ALIPAY_GATEWAY:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      - ALIPAY_NOTIFY_URL=${ALIPAY_NOTIFY_URL}
      - ALIPAY_RETURN_URL=${ALIPAY_RETURN_URL}
      - AMAP_KEY=${AMAP_KEY}
      - OSS_REGION=${OSS_REGION:-oss-cn-beijing}
      - OSS_BUCKET=${OSS_BUCKET:-jean-os}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - SMS_ACCESS_KEY_ID=${SMS_ACCESS_KEY_ID}
      - SMS_ACCESS_KEY_SECRET=${SMS_ACCESS_KEY_SECRET}
      - SMS_SIGN_NAME=${SMS_SIGN_NAME:-速通互联验证码}
      - SMS_TEMPLATE_CODE=${SMS_TEMPLATE_CODE:-100001}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - xiaotuxian-net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: xiaotuxian
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xiaotuxian-net
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  xiaotuxian-net:
    driver: bridge
